spring.datasource.url=jdbc:h2:mem:cpr_db_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=TestOnlyJwtSecretKeyForTestingAtLeast32Characters!!
jwt.expiration-ms=3600000
qa.api.key=${QA_API_KEY:test-key}
qa.api.url=${QA_API_URL:http://localhost}
qa.api.model=${QA_API_MODEL:test-model}
