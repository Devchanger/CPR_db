spring.application.name=cpr_db

# ============================================================================
# 生产配置（部署到 /opt/cpr-db/application.properties）
# 由 systemd EnvironmentFile=/opt/cpr-db/.env 注入敏感密钥。
# 本文件不含任何明文密钥；所有敏感项走 ${ENV:默认值}，缺省值仅为占位符。
# ============================================================================

# ---------- Database (MySQL) ----------
spring.datasource.url=${CPR_DB_URL:jdbc:mysql://localhost:3306/cpr_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${CPR_DB_USERNAME:cpr_user}
spring.datasource.password=${CPR_DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 控制台在生产必须关闭（即使误部署也不会暴露 H2 控制台）
spring.h2.console.enabled=false

# 启动期由 Hibernate 演进 schema（幂等；配合 migration SQL 使用）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARS_LONG}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- QA / RAG（可选，留空则功能降级） ----------
qa.api.key=${QA_API_KEY:}
qa.api.url=${QA_API_URL:}
qa.api.model=${QA_API_MODEL:}

# ---------- CORS（生产填入真实前端域名，逗号分隔，禁止 *） ----------
cpr.cors.allowed-origins=${CPR_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- 文件上传 ----------
cpr.upload.dir=/opt/cpr-db/uploads

# ---------- 演示数据（生产关闭 mock 学生/成绩灌库） ----------
cpr.mock-seeder.enabled=false
